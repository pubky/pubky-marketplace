name: Build and Publish Docker Image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@main
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: true
          latest: true
          tags: |
            type=ref,event=tag
          platforms: |
            linux/arm64
            linux/amd64
          image: pubky-app
          cache_from: type=gha
          cache_to: type=gha,mode=max
          # NEXT_PUBLIC_APP_VERSION is the Sentry release (client and server); the sentry-release job below creates
          # the release under the same commit SHA. GIT_COMMIT is what GET /api/build reports.
          build_args: |
            NEXT_PUBLIC_DB_VERSION=9
            NEXT_PUBLIC_DB_NAME=shop-franky
            NEXT_PUBLIC_DEBUG_MODE=false
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}

  sentry-release:
    name: Create Sentry release
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # set-commits --auto walks the history back to the previous release's commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # Skips with a warning while the SENTRY_AUTH_TOKEN secret is unset. The deploy is recorded by whoever rolls
      # the image out, under the environment the container sets (docs/sentry.md).
      - name: Create the release, associate its commits and finalize it
        run: npx tsx scripts/sentry-release/main.ts
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: synonym-52
          SENTRY_PROJECT: pubky-marketplace
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
